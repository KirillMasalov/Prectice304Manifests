replicaCount: 1

image:
  repository: alpine
  tag: "latest"
  pullPolicy: IfNotPresent

echoText: "Hello from http-echo-server!"

containerPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Настройки Service
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Настройки Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: echo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []